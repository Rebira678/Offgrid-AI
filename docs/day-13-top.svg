<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
<defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M1,1 L15,8 L1,15 z" fill="context-stroke"/></marker></defs>
<rect width="1600" height="940" fill="#fbfaf7"/>
<text x="60" y="72" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="42" fill="#1f2328" font-weight="bold" text-anchor="start">See the whole system on one screen</text>
<text x="60" y="112" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#59636e" font-weight="normal" text-anchor="start">Offgrid, Day 13: separate processes, no shared memory, one honest view.</text>
<rect x="60" y="170" width="420" height="150" rx="14" fill="#ffffff" stroke="#1f5fa8" stroke-width="3"/>
<text x="82" y="210" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#1f5fa8" font-weight="bold" text-anchor="start">offgrid agent -route</text>
<text x="82" y="242" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2328" font-weight="normal" text-anchor="start">answers or defers each message</text>
<text x="82" y="268" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#59636e" font-weight="normal" text-anchor="start">counts: tier, decision latency</text>
<rect x="60" y="350" width="420" height="150" rx="14" fill="#ffffff" stroke="#1f5fa8" stroke-width="3"/>
<text x="82" y="390" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#1f5fa8" font-weight="bold" text-anchor="start">offgrid drain</text>
<text x="82" y="422" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2328" font-weight="normal" text-anchor="start">runs queued jobs</text>
<text x="82" y="448" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#59636e" font-weight="normal" text-anchor="start">counts: jobs, retries, latency, probes</text>
<rect x="620" y="170" width="380" height="150" rx="14" fill="#e8f3f1" stroke="#0f766e" stroke-width="3"/>
<text x="642" y="210" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#0f766e" font-weight="bold" text-anchor="start">metrics/agent.json</text>
<text x="642" y="242" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2328" font-weight="normal" text-anchor="start">a snapshot, rewritten every 1 s</text>
<text x="642" y="268" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#59636e" font-weight="normal" text-anchor="start">atomic: temp file, then rename</text>
<rect x="620" y="350" width="380" height="150" rx="14" fill="#e8f3f1" stroke="#0f766e" stroke-width="3"/>
<text x="642" y="390" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#0f766e" font-weight="bold" text-anchor="start">metrics/drain.json</text>
<text x="642" y="422" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2328" font-weight="normal" text-anchor="start">same, plus 'stopped' on a clean exit</text>
<text x="642" y="448" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#59636e" font-weight="normal" text-anchor="start">a crash leaves it simply stale</text>
<rect x="620" y="530" width="380" height="150" rx="14" fill="#e8f3f1" stroke="#0f766e" stroke-width="3"/>
<text x="642" y="570" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#0f766e" font-weight="bold" text-anchor="start">queue.db</text>
<text x="642" y="602" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2328" font-weight="normal" text-anchor="start">the real queue, opened READ-ONLY</text>
<text x="642" y="628" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#59636e" font-weight="normal" text-anchor="start">depth is read, never remembered</text>
<rect x="1140" y="300" width="400" height="200" rx="14" fill="#ffffff" stroke="#1f5fa8" stroke-width="3"/>
<text x="1162" y="340" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#1f5fa8" font-weight="bold" text-anchor="start">offgrid top</text>
<text x="1162" y="372" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2328" font-weight="normal" text-anchor="start">reads the files, repaints each second</text>
<text x="1162" y="398" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#59636e" font-weight="normal" text-anchor="start">pure render(view) -> text</text>
<text x="1162" y="424" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#59636e" font-weight="normal" text-anchor="start">plain ANSI, no UI framework</text>
<line x1="480" y1="245" x2="620" y2="245" stroke="#59636e" stroke-width="4" marker-end="url(#ah)"/>
<line x1="480" y1="425" x2="620" y2="425" stroke="#59636e" stroke-width="4" marker-end="url(#ah)"/>
<line x1="1000" y1="245" x2="1140" y2="360" stroke="#59636e" stroke-width="4" marker-end="url(#ah)"/>
<line x1="1000" y1="425" x2="1140" y2="410" stroke="#59636e" stroke-width="4" marker-end="url(#ah)"/>
<line x1="1000" y1="605" x2="1140" y2="460" stroke="#59636e" stroke-width="4" marker-end="url(#ah)"/>
<text x="60" y="560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2328" font-weight="bold" text-anchor="start">slog (JSON or text) goes to a file or stderr:</text>
<text x="60" y="590" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="18" fill="#59636e" font-weight="normal" text-anchor="start">-slog FILE   -slog-format json   -slog-level debug</text>
<text x="60" y="620" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#59636e" font-weight="normal" text-anchor="start">off by default: the readable output is unchanged</text>
<rect x="60" y="730" width="1480" height="170" rx="14" fill="#ffffff" stroke="#c9ccd1" stroke-width="2"/>
<text x="84" y="772" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" font-weight="bold" text-anchor="start">The screen never presents old news as live</text>
<text x="84" y="806" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2328" font-weight="normal" text-anchor="start">A process that stopped writing is shown as silent, and the connection state it last reported is labelled 'last known: ... ago'.</text>
<text x="84" y="836" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2328" font-weight="normal" text-anchor="start">A state fixed by a flag (-net offline) never hides what a probing process sees. A bad file is reported, not fatal.</text>
<text x="84" y="868" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#c2410c" font-weight="bold" text-anchor="start">Not shown: tiers are for the latest agent run (each run is a new process); no real WiFi or Ollama was used in the demo.</text>
</svg>