<text x="90" y="906" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#59636e" font-weight="normal" text-anchor="start">Defaults (all adjustable): probe every 2 s; time to react = streak length x interval.</text>
<text x="90" y="932" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#59636e" font-weight="normal" text-anchor="start">Leaving ONLINE takes 2 bad probes; coming back takes 3 good ones: a false ONLINE wastes work, a late ONLINE only delays it.</text>
