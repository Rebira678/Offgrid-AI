<text x="60" y="72" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="42" fill="#1f2328" font-weight="bold" text-anchor="start">Three states, and it takes a streak to change your mind.</text>
<text x="60" y="112" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#59636e" font-weight="normal" text-anchor="start">Offgrid, Day 8: the connectivity monitor. Evidence is counted in consecutive probes, so one dropped packet flips nothing.</text>
