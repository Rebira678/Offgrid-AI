<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
<defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M1,1 L15,8 L1,15 z" fill="context-stroke"/></marker></defs>
<rect width="1600" height="940" fill="#fbfaf7"/>
<text x="60" y="72" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="42" fill="#1f2328" font-weight="bold" text-anchor="start">A switch to break your own network</text>
<text x="60" y="112" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#59636e" font-weight="normal" text-anchor="start">Every HTTP request passes through three faults you control. Your real WiFi is never touched.</text>
<rect x="60" y="170" width="300" height="110" rx="14" fill="#ffffff" stroke="#1f5fa8" stroke-width="3"/>
<text x="84" y="212" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#1f5fa8" font-weight="bold" text-anchor="start">offgrid net / agent</text>
<text x="84" y="244" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2328" font-weight="normal" text-anchor="start">probes, later sync</text>
<rect x="420" y="170" width="200" height="110" rx="14" fill="#ffffff" stroke="#1f5fa8" stroke-width="3"/>
<text x="444" y="212" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#1f5fa8" font-weight="bold" text-anchor="start">http.Client</text>
<text x="444" y="244" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2328" font-weight="normal" text-anchor="start">its own timeout</text>
<line x1="360" y1="225" x2="420" y2="225" stroke="#59636e" stroke-width="4" marker-end="url(#ah)"/>
<rect x="700" y="150" width="620" height="500" rx="14" fill="#f4f6f9" stroke="#1f5fa8" stroke-width="3"/>
<text x="724" y="192" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" fill="#1f5fa8" font-weight="bold" text-anchor="start">netfault.Transport</text>
<line x1="620" y1="225" x2="700" y2="225" stroke="#59636e" stroke-width="4" marker-end="url(#ah)"/>
<rect x="724" y="215" width="572" height="120" rx="14" fill="#ffffff" stroke="#c2410c" stroke-width="3"/>
<text x="748" y="253" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#c2410c" font-weight="bold" text-anchor="start">1  Partitioned?</text>
<text x="748" y="285" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2328" font-weight="normal" text-anchor="start">refuse: fails at once, "network is unreachable"</text>
<text x="748" y="313" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#59636e" font-weight="normal" text-anchor="start">blackhole: never answers, only your timeout ends it</text>
<rect x="724" y="365" width="572" height="120" rx="14" fill="#ffffff" stroke="#c2410c" stroke-width="3"/>
<text x="748" y="403" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#c2410c" font-weight="bold" text-anchor="start">2  Dropped?  (-fault-drop %, seeded)</text>
<text x="748" y="435" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2328" font-weight="normal" text-anchor="start">the request vanishes; the caller waits for its timeout</text>
<text x="748" y="463" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#59636e" font-weight="normal" text-anchor="start">same seed + same order = same drops</text>
<rect x="724" y="515" width="572" height="120" rx="14" fill="#ffffff" stroke="#1f5fa8" stroke-width="3"/>
<text x="748" y="553" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#1f5fa8" font-weight="bold" text-anchor="start">3  Latency  (+ jitter)</text>
<text x="748" y="585" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2328" font-weight="normal" text-anchor="start">sleep, then let the request through</text>
<text x="748" y="613" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#59636e" font-weight="normal" text-anchor="start">this is what makes a link SLOW, not DOWN</text>
<line x1="1010" y1="335" x2="1010" y2="365" stroke="#59636e" stroke-width="4" marker-end="url(#ah)"/>
<text x="1026" y="356" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e" font-weight="normal" text-anchor="start">no</text>
<line x1="1010" y1="485" x2="1010" y2="515" stroke="#59636e" stroke-width="4" marker-end="url(#ah)"/>
<text x="1026" y="506" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e" font-weight="normal" text-anchor="start">no</text>
<rect x="1400" y="525" width="160" height="100" rx="14" fill="#e8f3f1" stroke="#0f766e" stroke-width="3"/>
<text x="1480" y="566" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="21" fill="#0f766e" font-weight="bold" text-anchor="middle">real net</text>
<text x="1480" y="596" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2328" font-weight="normal" text-anchor="middle">or server</text>
<line x1="1296" y1="575" x2="1400" y2="575" stroke="#0f766e" stroke-width="4" marker-end="url(#ah)"/>
<rect x="60" y="330" width="560" height="300" rx="14" fill="#ffffff" stroke="#c2410c" stroke-width="3"/>
<text x="84" y="372" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#c2410c" font-weight="bold" text-anchor="start">Who flips the partition?</text>
<text x="84" y="414" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="19" fill="#1f2328" font-weight="normal" text-anchor="start">-fault-partition</text>
<text x="84" y="438" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e" font-weight="normal" text-anchor="start">on from the start</text>
<text x="84" y="486" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="19" fill="#1f2328" font-weight="normal" text-anchor="start">-fault-file F</text>
<text x="84" y="510" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e" font-weight="normal" text-anchor="start">a script rewrites it: offgrid fault set partition</text>
<text x="84" y="558" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="19" fill="#1f2328" font-weight="normal" text-anchor="start">-fault-schedule ok:5s,partition:3s</text>
<text x="84" y="582" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e" font-weight="normal" text-anchor="start">repeats by itself, same every run</text>
<text x="84" y="614" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e" font-weight="normal" text-anchor="start">any one of them says partition = partitioned</text>
<line x1="620" y1="420" x2="724" y2="285" stroke="#c2410c" stroke-width="4" marker-end="url(#ah)"/>
<text x="60" y="720" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="21" fill="#1f2328" font-weight="bold" text-anchor="start">One schedule, ok:5s,partition:3s, and what offgrid reports</text>
<rect x="60.0" y="744" width="462.5" height="46" rx="6" fill="#0f766e" stroke="#0f766e" stroke-width="1"/>
<text x="291.25" y="774" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle">ok  5 s</text>
<rect x="522.5" y="744" width="277.5" height="46" rx="6" fill="#c2410c" stroke="#c2410c" stroke-width="1"/>
<text x="661.25" y="774" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle">partition  3 s</text>
<rect x="800.0" y="744" width="462.5" height="46" rx="6" fill="#0f766e" stroke="#0f766e" stroke-width="1"/>
<text x="1031.25" y="774" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle">ok  5 s</text>
<rect x="1262.5" y="744" width="277.5" height="46" rx="6" fill="#c2410c" stroke="#c2410c" stroke-width="1"/>
<text x="1401.25" y="774" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle">partition  3 s</text>
<text x="60" y="832" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#0f766e" font-weight="bold" text-anchor="start">ONLINE</text>
<text x="532.5" y="832" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#c2410c" font-weight="bold" text-anchor="start">... OFFLINE after 3 failed probes</text>
<text x="810.0" y="860" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#0f766e" font-weight="bold" text-anchor="start">back ONLINE after 3 good probes</text>
<text x="60" y="896" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#59636e" font-weight="normal" text-anchor="start">The delay is the point: the monitor needs several probes in a row, so it does not flap. Detection time is about (probes needed) x (probe interval).</text>
</svg>