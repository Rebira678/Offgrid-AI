<text x="90" y="956" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2328" font-weight="normal" text-anchor="start">State sync sends whole tables and cannot tell “I edited it” from “you deleted it”.</text>
<text x="90" y="988" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2328" font-weight="normal" text-anchor="start">Op sync sends what is missing, and applying an op twice is detectable by its (node, seq).</text>
<text x="90" y="1020" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#59636e" font-weight="normal" text-anchor="start">That is the foundation for the hybrid clock (Day 15), merge rules (16–18) and the sync protocol (19).</text>
